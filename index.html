<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>مدرسة الجيل الجديد</title>
    <meta name="description" content="المنصة المتكاملة لإدارة المدارس والتحصيل العلمي." />
    <meta name="author" content="مدرسة الجيل الجديد" />
    <meta name="keywords" content="إدارة مدرسة, نظام مدرسي, SaaS, تعليم, حضور, معلمين, أولياء أمور" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="الجيل الجديد" />

    <!-- Favicon (Suppressed default request) -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />

    <!-- Open Graph -->
    <meta property="og:title" content="مدرسة الجيل الجديد — نظام الإدارة المدرسية" />
    <meta property="og:description" content="منصة احترافية لإدارة المدارس والتحصيل العلمي." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_EG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="مدرسة الجيل الجديد" />
    <meta name="twitter:description" content="مدرسة الجيل الجديد — نظام الإدارة والمتابعة" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Preload font CSS to avoid render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>

    <style>
      :root { background-color: #f8fafc; }
      html.dark { background-color: #0a0f1e; }
      html.light { background-color: #f8fafc; }
      body { margin: 0; padding: 0; background-color: inherit; }
      #app-boot-fallback { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #0f172a; font-family: Cairo, "Segoe UI", Arial, sans-serif; text-align: center; }
      #app-boot-fallback__card { max-width: 360px; }
      #app-boot-fallback__spinner { width: 36px; height: 36px; margin: 0 auto 18px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: app-spin .8s linear infinite; }
      #app-boot-fallback__retry { display: none; margin: 20px auto 0; border: 0; border-radius: 12px; padding: 12px 18px; background: #4f46e5; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      #app-boot-fallback.is-failed #app-boot-fallback__spinner { display: none; }
      #app-boot-fallback.is-failed #app-boot-fallback__retry { display: inline-block; }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>

    <script>
      (function() {
        try {
          // 1. Theme initialization
          var theme = localStorage.getItem('theme') || 'light';
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;

          // 2. Immediate Branding Sync (Prevent Flicker)
          var userCache = localStorage.getItem('app_user_cache');
          if (userCache) {
            var user = JSON.parse(userCache);
            if (user && user.schoolId) {
              var brandingCache = localStorage.getItem('branding_' + user.schoolId);
              if (brandingCache) {
                var branding = JSON.parse(brandingCache);
                
                // Update Title
                if (branding.name) {
                  var cleanName = branding.name.replace(/^مدرسة\s*/i, '').replace(/^مدرسه\s*/i, '').trim();
                  cleanName = cleanName.split(' — ')[0];
                  document.title = cleanName;
                }

                // Update Favicon (use optimized small version to avoid loading full-res image)
                if (branding.logo_url) {
                  var rawLogoUrl = branding.logo_url;
                  var faviconUrl = rawLogoUrl;
                  // Transform to render/image for smaller favicon (32px)
                  if (rawLogoUrl.includes('supabase.co/storage/v1/object/public/')) {
                    faviconUrl = rawLogoUrl.replace('/storage/v1/object/public/', '/storage/v1/render/image/public/');
                    var sep = faviconUrl.includes('?') ? '&' : '?';
                    faviconUrl = faviconUrl + sep + 'width=32&quality=80&resize=contain';
                  }
                  var link = document.querySelector("link[rel~='icon']");
                  if (link) link.href = faviconUrl;

                  // apple-touch-icon uses slightly larger size
                  var appleUrl = rawLogoUrl;
                  if (rawLogoUrl.includes('supabase.co/storage/v1/object/public/')) {
                    appleUrl = rawLogoUrl.replace('/storage/v1/object/public/', '/storage/v1/render/image/public/');
                    var sep2 = appleUrl.includes('?') ? '&' : '?';
                    appleUrl = appleUrl + sep2 + 'width=120&quality=75&resize=contain';
                  }
                  var appleLink = document.querySelector("link[rel~='apple-touch-icon']");
                  if (appleLink) appleLink.href = appleUrl;
                }
              }
            }
          }
        } catch (e) {
          console.error('Branding pre-sync failed:', e);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="app-boot-fallback" role="status" aria-live="polite">
        <div id="app-boot-fallback__card">
          <div id="app-boot-fallback__spinner" aria-hidden="true"></div>
          <strong id="app-boot-fallback__title">جاري فتح النظام…</strong>
          <p id="app-boot-fallback__message">لحظات من فضلك.</p>
          <button id="app-boot-fallback__retry" type="button" onclick="window.location.reload()">إعادة المحاولة</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.setTimeout(function () {
        if (window.__schoolAppMounted) return;
        var fallback = document.getElementById('app-boot-fallback');
        var title = document.getElementById('app-boot-fallback__title');
        var message = document.getElementById('app-boot-fallback__message');
        if (fallback) fallback.classList.add('is-failed');
        if (title) title.textContent = 'تعذّر فتح النظام';
        if (message) message.textContent = 'يرجى التحقق من الاتصال ثم إعادة المحاولة.';
      }, 10000);
    </script>
  </body>
</html>
